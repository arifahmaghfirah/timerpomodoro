<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pomodoro Timer 🌸</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --peach: #F5C4A3;
      --peach-light: #FAE8DC;
      --peach-dark: #E8956A;
      --sage: #7A9E8E;
      --sage-light: #B8D4C8;
      --sage-dark: #4A7060;
      --mustard: #C9882A;
      --mustard-light: #F0C878;
      --cream: #FDF6EF;
      --text-dark: #3A2A1A;
      --text-mid: #6B4E35;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
    }

    .app {
      width: 100%;
      max-width: 480px;
      position: relative;
      overflow: hidden;
      min-height: 100vh;
    }

    /* Decorative blobs */
    .blob { position: absolute; pointer-events: none; z-index: 0; opacity: 0.35; border-radius: 60% 40% 70% 30%/50% 60% 40% 50%; }
    .b1 { top: -30px; left: -40px; width: 160px; height: 160px; background: var(--peach); }
    .b2 { bottom: 80px; right: -30px; width: 120px; height: 140px; background: var(--mustard-light); border-radius: 40% 60% 30% 70%/60% 40% 70% 30%; }
    .b3 { top: 45%; left: -20px; width: 80px; height: 100px; background: var(--sage-light); border-radius: 50% 50% 40% 60%/40% 60% 50% 50%; }

    .flower { position: absolute; pointer-events: none; z-index: 0; }

    /* Notification bar */
    .notif-bar {
      background: var(--sage); color: white; text-align: center;
      padding: 10px 20px; font-size: 13px; position: relative; z-index: 10;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
      min-height: 40px; display: flex; align-items: center; justify-content: center;
    }
    .notif-bar.show { opacity: 1; }

    /* Header */
    .header { text-align: center; padding: 24px 20px 8px; position: relative; z-index: 1; }
    .brand {
      font-family: 'Playfair Display', serif; font-size: 12px;
      font-style: italic; color: var(--sage-dark);
      letter-spacing: 2px; text-transform: uppercase;
    }
    .title {
      font-family: 'Playfair Display', serif; font-size: 28px;
      font-weight: 700; color: var(--text-dark); line-height: 1.1; margin-top: 4px;
    }
    .title span { color: var(--mustard); }

    /* Mode tabs */
    .mode-tabs {
      display: flex; gap: 6px; justify-content: center;
      margin: 14px 20px 0; position: relative; z-index: 1;
    }
    .mode-btn {
      flex: 1; padding: 8px 4px; border-radius: 20px;
      border: 1.5px solid var(--peach-dark); background: transparent;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      font-size: 12px; color: var(--text-mid); font-weight: 500; transition: all 0.2s;
    }
    .mode-btn.active { background: var(--sage); border-color: var(--sage); color: white; }
    .mode-btn:hover:not(.active) { background: var(--peach-light); }

    /* Timer card */
    .timer-card {
      margin: 18px 20px 0; padding: 24px 20px;
      background: var(--white); border-radius: 24px;
      border: 1.5px solid var(--peach);
      position: relative; z-index: 1; text-align: center;
    }
    .session-label {
      font-size: 11px; color: var(--sage-dark);
      letter-spacing: 2px; text-transform: uppercase;
      font-weight: 500; margin-bottom: 12px;
    }
    .ring-wrap { position: relative; display: inline-block; margin: 6px auto 16px; }
    .ring-bg { fill: none; stroke: var(--peach-light); stroke-width: 10; }
    .ring-prog {
      fill: none; stroke: var(--sage); stroke-width: 10;
      stroke-linecap: round; transform: rotate(-90deg);
      transform-origin: center; transition: stroke-dashoffset 0.5s ease;
    }
    .ring-time {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); text-align: center; width: 120px;
    }
    .time-disp {
      font-family: 'Playfair Display', serif; font-size: 42px;
      font-weight: 700; color: var(--text-dark); line-height: 1;
    }
    .time-hint { font-size: 10px; color: var(--sage-dark); letter-spacing: 1px; margin-top: 4px; }

    /* Controls */
    .controls {
      display: flex; gap: 10px; justify-content: center;
      align-items: center; margin-top: 6px;
    }
    .btn-play {
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--mustard); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: white; transition: all 0.15s;
    }
    .btn-play:hover { background: var(--mustard-light); color: var(--text-dark); transform: scale(1.06); }
    .btn-play:active { transform: scale(0.97); }
    .btn-round {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--peach-light); border: 1.5px solid var(--peach);
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 16px; color: var(--text-mid); transition: all 0.15s;
    }
    .btn-round:hover { background: var(--peach); }
    .btn-reset {
      width: 40px; height: 40px; border-radius: 50%;
      background: #FFF0F0; border: 1.5px solid #FFCDD2;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 16px; color: #C0392B; transition: all 0.15s;
    }
    .btn-reset:hover { background: #FFCDD2; }
    .btn-settings {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--peach-light); border: 1.5px solid var(--peach);
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 16px; color: var(--text-mid); transition: all 0.15s;
    }
    .btn-settings:hover { background: var(--peach); }

    /* Sessions dots */
    .sessions-row { margin: 14px 20px 0; position: relative; z-index: 1; text-align: center; }
    .sessions-label { font-size: 10px; color: var(--text-mid); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    .dots { display: flex; gap: 8px; justify-content: center; }
    .dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--peach-dark); background: transparent; transition: all 0.3s; }
    .dot.done { background: var(--mustard); border-color: var(--mustard); }
    .dot.active { background: var(--sage); border-color: var(--sage); transform: scale(1.2); }

    /* Stats */
    .stats-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin: 14px 20px 0; position: relative; z-index: 1;
    }
    .stat-card {
      background: var(--peach-light); border-radius: 14px;
      padding: 10px 8px; text-align: center; border: 1px solid var(--peach);
    }
    .stat-val { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: var(--text-dark); }
    .stat-lbl { font-size: 9px; color: var(--text-mid); letter-spacing: 0.5px; margin-top: 2px; text-transform: uppercase; }

    /* Settings panel */
    .settings-panel {
      margin: 14px 20px 0; background: var(--white); border-radius: 20px;
      border: 1.5px solid var(--sage-light); padding: 18px;
      position: relative; z-index: 1; display: none;
    }
    .settings-panel.open { display: block; }
    .settings-title {
      font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700;
      color: var(--text-dark); margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .setting-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .setting-label { font-size: 13px; color: var(--text-mid); width: 120px; flex-shrink: 0; }
    .setting-input {
      width: 64px; padding: 6px 10px; border-radius: 10px;
      border: 1.5px solid var(--peach); background: var(--peach-light);
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      color: var(--text-dark); text-align: center; outline: none;
    }
    .setting-input:focus { border-color: var(--sage); }
    .setting-unit { font-size: 12px; color: var(--sage-dark); }
    .btn-save {
      margin-top: 6px; padding: 9px 22px; border-radius: 12px;
      background: var(--sage); border: none; color: white;
      font-family: 'DM Sans', sans-serif; font-size: 13px;
      font-weight: 500; cursor: pointer; transition: all 0.15s;
    }
    .btn-save:hover { background: var(--sage-dark); }
    .btn-full-reset {
      margin-top: 6px; margin-left: 8px; padding: 9px 18px; border-radius: 12px;
      background: #FFF0F0; border: 1.5px solid #FFCDD2; color: #C0392B;
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .btn-full-reset:hover { background: #FFCDD2; }

    /* Task section */
    .task-section { margin: 14px 20px 30px; position: relative; z-index: 1; }
    .task-label { font-size: 10px; color: var(--sage-dark); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; margin-bottom: 8px; }
    .task-input-row { display: flex; gap: 8px; }
    .task-input {
      flex: 1; padding: 10px 14px; border-radius: 12px;
      border: 1.5px solid var(--peach); background: var(--white);
      font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text-dark); outline: none;
    }
    .task-input:focus { border-color: var(--sage); }
    .btn-add {
      padding: 10px 16px; border-radius: 12px; background: var(--sage);
      border: none; color: white; font-size: 13px; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-weight: 500; white-space: nowrap;
    }
    .btn-add:hover { background: var(--sage-dark); }
    .task-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .task-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      border-radius: 12px; background: var(--white); border: 1px solid var(--peach);
      font-size: 13px; color: var(--text-dark);
    }
    .task-item.done-task { text-decoration: line-through; color: var(--sage-dark); background: var(--peach-light); }
    .task-check {
      width: 18px; height: 18px; border-radius: 50%;
      border: 1.5px solid var(--peach-dark); background: transparent;
      cursor: pointer; flex-shrink: 0; display: flex;
      align-items: center; justify-content: center; font-size: 10px; color: transparent;
    }
    .task-check.checked { background: var(--sage); border-color: var(--sage); color: white; }
    .task-del { margin-left: auto; cursor: pointer; color: var(--peach-dark); font-size: 14px; background: none; border: none; padding: 2px; }
    .task-del:hover { color: #C0392B; }

    /* Mobile responsive */
    @media (max-width: 520px) {
      .app { max-width: 100%; }
      .time-disp { font-size: 36px; }
    }

    /* Page title bar */
    .page-topbar {
      background: var(--sage); color: white; text-align: center;
      padding: 6px; font-size: 11px; letter-spacing: 1px;
      text-transform: uppercase; font-family: 'DM Sans', sans-serif;
      position: relative; z-index: 2;
    }
  </style>
</head>
<body>

<div class="app">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <!-- Bunga dekorasi -->
  <div class="flower" style="top:10px;right:18px;">
    <svg width="58" height="58" viewBox="0 0 60 60" style="opacity:0.22">
      <circle cx="30" cy="30" r="8" fill="#C9882A"/>
      <ellipse cx="30" cy="10" rx="8" ry="12" fill="#F5C4A3" transform="rotate(0,30,30)"/>
      <ellipse cx="30" cy="10" rx="8" ry="12" fill="#F5C4A3" transform="rotate(45,30,30)"/>
      <ellipse cx="30" cy="10" rx="8" ry="12" fill="#F5C4A3" transform="rotate(90,30,30)"/>
      <ellipse cx="30" cy="10" rx="8" ry="12" fill="#F5C4A3" transform="rotate(135,30,30)"/>
      <ellipse cx="30" cy="10" rx="8" ry="12" fill="#FAE8DC" transform="rotate(22,30,30)"/>
      <ellipse cx="30" cy="10" rx="8" ry="12" fill="#FAE8DC" transform="rotate(67,30,30)"/>
      <ellipse cx="30" cy="10" rx="8" ry="12" fill="#FAE8DC" transform="rotate(112,30,30)"/>
      <ellipse cx="30" cy="10" rx="8" ry="12" fill="#FAE8DC" transform="rotate(157,30,30)"/>
    </svg>
  </div>
  <div class="flower" style="bottom:200px;left:8px;">
    <svg width="42" height="42" viewBox="0 0 40 40" style="opacity:0.2">
      <circle cx="20" cy="20" r="5" fill="#7A9E8E"/>
      <ellipse cx="20" cy="7" rx="5" ry="7" fill="#B8D4C8" transform="rotate(0,20,20)"/>
      <ellipse cx="20" cy="7" rx="5" ry="7" fill="#B8D4C8" transform="rotate(60,20,20)"/>
      <ellipse cx="20" cy="7" rx="5" ry="7" fill="#B8D4C8" transform="rotate(120,20,20)"/>
      <ellipse cx="20" cy="7" rx="5" ry="7" fill="#B8D4C8" transform="rotate(180,20,20)"/>
      <ellipse cx="20" cy="7" rx="5" ry="7" fill="#B8D4C8" transform="rotate(240,20,20)"/>
      <ellipse cx="20" cy="7" rx="5" ry="7" fill="#B8D4C8" transform="rotate(300,20,20)"/>
    </svg>
  </div>

  <div class="notif-bar" id="notif"></div>

  <div class="header">
    <div class="brand">your focus space</div>
    <div class="title">pomodoro <span>timer</span></div>
  </div>

  <div class="mode-tabs">
    <button class="mode-btn active" onclick="setMode('focus')">🍅 Focus</button>
    <button class="mode-btn" onclick="setMode('short')">☕ Short Break</button>
    <button class="mode-btn" onclick="setMode('long')">🌿 Long Break</button>
  </div>

  <div class="timer-card">
    <div class="session-label" id="sessionLabel">Focus Session</div>
    <div class="ring-wrap">
      <svg width="180" height="180" viewBox="0 0 180 180">
        <circle class="ring-bg" cx="90" cy="90" r="80"/>
        <circle class="ring-prog" id="ringProg" cx="90" cy="90" r="80"
          stroke-dasharray="502.65" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-time">
        <div class="time-disp" id="timeDisp">25:00</div>
        <div class="time-hint" id="timeHint">get to work ✨</div>
      </div>
    </div>
    <div class="controls">
      <button class="btn-round" onclick="restartCurrent()" title="Restart sesi ini" aria-label="Restart sesi">
        <i class="ti ti-player-skip-back"></i>
      </button>
      <button class="btn-play" id="playBtn" onclick="toggleTimer()" aria-label="Play/Pause">
        <i class="ti ti-player-play" id="playIcon"></i>
      </button>
      <button class="btn-round" onclick="skipNext()" title="Skip" aria-label="Skip">
        <i class="ti ti-player-skip-forward"></i>
      </button>
      <button class="btn-reset" onclick="fullReset()" title="Reset semua" aria-label="Reset semua">
        <i class="ti ti-refresh"></i>
      </button>
      <button class="btn-settings" onclick="toggleSettings()" title="Settings" aria-label="Settings">
        <i class="ti ti-settings"></i>
      </button>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-title">
      <i class="ti ti-sliders" style="font-size:16px;color:var(--sage);"></i>
      atur durasi waktu
    </div>
    <div class="setting-row">
      <span class="setting-label">🍅 Focus</span>
      <input class="setting-input" type="number" id="sFocus" value="25" min="1" max="120"/>
      <span class="setting-unit">menit</span>
    </div>
    <div class="setting-row">
      <span class="setting-label">☕ Short Break</span>
      <input class="setting-input" type="number" id="sShort" value="5" min="1" max="60"/>
      <span class="setting-unit">menit</span>
    </div>
    <div class="setting-row">
      <span class="setting-label">🌿 Long Break</span>
      <input class="setting-input" type="number" id="sLong" value="15" min="1" max="60"/>
      <span class="setting-unit">menit</span>
    </div>
    <div style="display:flex;gap:0;margin-top:8px;flex-wrap:wrap;gap:8px;">
      <button class="btn-save" onclick="saveSettings()">Simpan ✓</button>
      <button class="btn-full-reset" onclick="fullReset()">Reset semua data</button>
    </div>
  </div>

  <div class="sessions-row">
    <div class="sessions-label">Sesi hari ini</div>
    <div class="dots" id="dotsRow"></div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val" id="stFocus">0</div>
      <div class="stat-lbl">Sesi Fokus</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stMins">0</div>
      <div class="stat-lbl">Menit Fokus</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stTasks">0</div>
      <div class="stat-lbl">Task Selesai</div>
    </div>
  </div>

  <div class="task-section">
    <div class="task-label">🌸 tasks hari ini</div>
    <div class="task-input-row">
      <input class="task-input" id="taskInp" placeholder="Tambah task baru..."
        onkeydown="if(event.key==='Enter')addTask()"/>
      <button class="btn-add" onclick="addTask()">+ Add</button>
    </div>
    <div class="task-list" id="taskList"></div>
  </div>
</div>

<script>
  const CIRCUMFERENCE = 2 * Math.PI * 80;
  let cfg = { focus: 25, short: 5, long: 15 };
  let currentMode = 'focus';
  let totalSec = cfg.focus * 60;
  let remaining = totalSec;
  let running = false;
  let iv = null;
  let sessions = 0, doneTasks = 0, totalMins = 0;
  let tasks = [];

  const modeMap = {
    focus: { label: 'Focus Session', hint: 'get to work ✨', color: '#7A9E8E' },
    short: { label: 'Short Break ☕', hint: 'take a breather 🌸', color: '#C9882A' },
    long:  { label: 'Long Break 🌿', hint: 'recharge yourself 💚', color: '#E8956A' }
  };

  function setMode(mode, fromAuto) {
    if (running) toggleTimer();
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach((b, i) => {
      b.classList.toggle('active', ['focus','short','long'][i] === mode);
    });
    const m = modeMap[mode];
    totalSec = cfg[mode] * 60;
    remaining = totalSec;
    document.getElementById('sessionLabel').textContent = m.label;
    document.getElementById('timeHint').textContent = m.hint;
    document.getElementById('ringProg').style.stroke = m.color;
    updateDisp(); updateRing();
    if (!fromAuto) showNotif('Mode: ' + m.label);
  }

  function updateDisp() {
    const m = Math.floor(remaining / 60), s = remaining % 60;
    document.getElementById('timeDisp').textContent =
      String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    document.title = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0') + ' — Pomodoro Timer';
  }

  function updateRing() {
    const offset = CIRCUMFERENCE * (1 - remaining / totalSec);
    document.getElementById('ringProg').style.strokeDashoffset = offset;
  }

  function toggleTimer() {
    running = !running;
    const icon = document.getElementById('playIcon');
    if (running) {
      icon.className = 'ti ti-player-pause';
      iv = setInterval(() => {
        remaining--;
        updateDisp(); updateRing();
        if (remaining <= 0) completeSession();
      }, 1000);
    } else {
      icon.className = 'ti ti-player-play';
      clearInterval(iv);
    }
  }

  function completeSession() {
    clearInterval(iv); running = false;
    document.getElementById('playIcon').className = 'ti ti-player-play';
    if (currentMode === 'focus') {
      sessions++; totalMins += cfg.focus;
      document.getElementById('stFocus').textContent = sessions;
      document.getElementById('stMins').textContent = totalMins;
      updateDots();
      // Notifikasi browser
      if (Notification.permission === 'granted') {
        new Notification('🍅 Sesi Fokus Selesai!', { body: 'Saatnya istirahat sebentar ya!' });
      }
      showNotif('🎉 Sesi fokus selesai! Istirahat dulu!');
      if (sessions % 4 === 0) setTimeout(() => setMode('long', true), 1200);
      else setTimeout(() => setMode('short', true), 1200);
    } else {
      if (Notification.permission === 'granted') {
        new Notification('✨ Break Selesai!', { body: 'Yuk fokus lagi!' });
      }
      showNotif('✨ Break selesai! Yuk fokus lagi!');
      setTimeout(() => setMode('focus', true), 1200);
    }
  }

  function restartCurrent() {
    if (running) toggleTimer();
    remaining = totalSec;
    updateDisp(); updateRing();
    showNotif('Timer di-restart ↺');
  }

  function skipNext() {
    if (running) toggleTimer();
    remaining = 0;
    updateDisp(); updateRing();
    setTimeout(completeSession, 200);
  }

  function fullReset() {
    if (running) toggleTimer();
    sessions = 0; doneTasks = 0; totalMins = 0; tasks = [];
    document.getElementById('stFocus').textContent = 0;
    document.getElementById('stMins').textContent = 0;
    document.getElementById('stTasks').textContent = 0;
    document.getElementById('taskList').innerHTML = '';
    setMode('focus', true);
    updateDots();
    showNotif('🔄 Semua data di-reset. Mulai fresh!');
  }

  function updateDots() {
    const row = document.getElementById('dotsRow');
    row.innerHTML = '';
    for (let i = 0; i < 8; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      if (i < sessions) d.classList.add('done');
      else if (i === sessions) d.classList.add('active');
      row.appendChild(d);
    }
  }

  function toggleSettings() {
    document.getElementById('settingsPanel').classList.toggle('open');
  }

  function saveSettings() {
    const f = parseInt(document.getElementById('sFocus').value) || 25;
    const s = parseInt(document.getElementById('sShort').value) || 5;
    const l = parseInt(document.getElementById('sLong').value) || 15;
    cfg = {
      focus: Math.min(120, Math.max(1, f)),
      short: Math.min(60, Math.max(1, s)),
      long:  Math.min(60, Math.max(1, l))
    };
    document.getElementById('sFocus').value = cfg.focus;
    document.getElementById('sShort').value = cfg.short;
    document.getElementById('sLong').value = cfg.long;
    if (running) toggleTimer();
    totalSec = cfg[currentMode] * 60;
    remaining = totalSec;
    updateDisp(); updateRing();
    document.getElementById('settingsPanel').classList.remove('open');
    showNotif('✅ Disimpan! Focus: ' + cfg.focus + 'm | Short: ' + cfg.short + 'm | Long: ' + cfg.long + 'm');
  }

  function addTask() {
    const inp = document.getElementById('taskInp');
    const txt = inp.value.trim();
    if (!txt) return;
    tasks.push({ text: txt, done: false });
    inp.value = '';
    renderTasks();
  }

  function renderTasks() {
    const list = document.getElementById('taskList');
    list.innerHTML = '';
    tasks.forEach((t, i) => {
      const div = document.createElement('div');
      div.className = 'task-item' + (t.done ? ' done-task' : '');
      div.innerHTML = `
        <button class="task-check ${t.done ? 'checked' : ''}" onclick="toggleTask(${i})" aria-label="Toggle task">${t.done ? '✓' : ''}</button>
        <span style="flex:1">${t.text}</span>
        <button class="task-del" onclick="delTask(${i})" aria-label="Hapus task">
          <i class="ti ti-x"></i>
        </button>`;
      list.appendChild(div);
    });
  }

  function toggleTask(i) {
    tasks[i].done = !tasks[i].done;
    if (tasks[i].done) { doneTasks++; showNotif('✅ Task selesai! Good job! 🌸'); }
    else doneTasks = Math.max(0, doneTasks - 1);
    document.getElementById('stTasks').textContent = doneTasks;
    renderTasks();
  }

  function delTask(i) { tasks.splice(i, 1); renderTasks(); }

  function showNotif(msg) {
    const n = document.getElementById('notif');
    n.textContent = msg; n.classList.add('show');
    setTimeout(() => n.classList.remove('show'), 3000);
  }

  // Minta izin notifikasi browser
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }

  // Init
  updateDots(); updateDisp(); updateRing();
  document.getElementById('ringProg').style.stroke = modeMap.focus.color;
</script>
</body>
</html>
